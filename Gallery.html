<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Vault 📸❤️</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (performance.navigation.type === 1) { window.location.href = "index.html"; }
    </script>
    <style>
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .gallery-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid #ff758c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .gallery-img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📸 Our Memories</h2>
        <p class="subtitle">Pyaari memories bas aapke liye! ✨</p>

        <div class="gallery-grid">
            <img src="photo1.jpg" class="gallery-img" alt="Memory 1">
            <img src="photo2.jpg" class="gallery-img" alt="Memory 2">
            <img src="photo3.jpg" class="gallery-img" alt="Memory 3">
        </div>

        <a href="index.html" style="display: block; margin-top: 25px; color: #ff2e63; font-weight: bold; text-decoration: none;">Restart Love Story 🔄</a>
    </div>
</body>
</html>
