<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Vault 📸❤️</title>
    <!-- Beautiful fonts ke liye Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body: LOVE LETTER BACKGROUND */
       /* Body: LOVE LETTER BACKGROUND */
        /* Body: ROMANTIC PINK GRADIENT BACKGROUND */
       /* Body: ROMANTIC IMAGE BACKGROUND */
        body {
            /* Yahan tumhari photo lagayi gayi hai */
            background-image: url('image_0bb1a2.jpg');
            background-size: cover; /* Photo poori screen par fit aayegi */
            background-position: center; /* Photo center mein rahegi */
            background-attachment: fixed; /* Scroll karne par background wahi rahega */
            background-repeat: no-repeat; /* Photo baar-baar repeat nahi hogi */
            
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .card h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #f79bc3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 50px;
        }

        /* Gallery Grid Setup */
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-top: 20px;
            padding: 20px 10px;
            width: 100%;
        }

        /* Polaroid Style */
        .polaroid {
            background: white;
            padding: 10px 10px 40px 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 180px; 
            transition: transform 0.3s ease-in-out, z-index 0.3s;
            position: relative;
            cursor: pointer;
            border-radius: 5px;
        }

        .polaroid img {
            width: 100%;
            height: 180px; 
            object-fit: cover;
            border-radius: 3px;
        }

        .polaroid-text {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            color: #333;
        }

        /* Random Teda-Meda Effect */
        .polaroid:nth-child(even) { transform: rotate(3deg); }
        .polaroid:nth-child(odd) { transform: rotate(-2deg); }
        .polaroid:nth-child(3n) { transform: rotate(5deg); }
        .polaroid:nth-child(4n) { transform: rotate(-4deg); }

        /* Hover Effect */
        .polaroid:hover {
            transform: scale(1.1) rotate(0deg); 
            z-index: 10;
            box-shadow: 0 15px 35px rgba(247, 155, 195, 0.4); /* Hover par pink shadow */
        }

        /* Feedback Button Style */
        .gift-box {
            display: inline-block;
            background-color: #ff758c;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 30px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
        }

        .gift-box:hover {
            transform: scale(1.05);
            background-color: #200408;
        }

        /* Mobile phones ke liye settings */
        @media (max-width: 600px) {
            .polaroid {
                width: 150px; 
            }
            .polaroid img {
                height: 150px;
            }
            .card {
                padding: 20px;
            }
            .card h2 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>📸 Your Memories</h2>
            <p class="subtitle">YOUR BEAUTIFUL LIFE MOMENTS ✨</p>

            <!-- 15 Images ki Gallery -->
            <div class="gallery-grid">
                <div class="polaroid"><img src="1.jpg" alt="Memory"><div class="polaroid-text">Cute Moment</div></div>
                <div class="polaroid"><img src="2.jpg" alt="Memory"><div class="polaroid-text">Smile Again</div></div>
                <div class="polaroid"><img src="3.jpg" alt="Memory"><div class="polaroid-text">With You</div></div>
                <div class="polaroid"><img src="4.jpg" alt="Memory"><div class="polaroid-text">Always</div></div>
                <div class="polaroid"><img src="5.jpg" alt="Memory"><div class="polaroid-text">Happy Day</div></div>
                <div class="polaroid"><img src="6.jpg" alt="Memory"><div class="polaroid-text">Together</div></div>
                <div class="polaroid"><img src="7.jpg" alt="Memory"><div class="polaroid-text">Forever</div></div>
                <div class="polaroid"><img src="8.jpg" alt="Memory"><div class="polaroid-text">Memories</div></div>
                <div class="polaroid"><img src="9.jpg" alt="Memory"><div class="polaroid-text">Joy</div></div>
                <div class="polaroid"><img src="10.jpg" alt="Memory"><div class="polaroid-text">Perfect</div></div>
                <div class="polaroid"><img src="11.jpg" alt="Memory"><div class="polaroid-text">Magic</div></div>
                <div class="polaroid"><img src="12.jpg" alt="Memory"><div class="polaroid-text">Special</div></div>
                <div class="polaroid"><img src="13.jpg" alt="Memory"><div class="polaroid-text">Beautiful</div></div>
                <div class="polaroid"><img src="14.jpg" alt="Memory"><div class="polaroid-text">Love</div></div>
                <div class="polaroid"><img src="15.jpg" alt="Memory"><div class="polaroid-text">My Gift</div></div>
            </div>

            <a href="feedback.html" class="gift-box">
                Say Something To Me 💌
            </a>
        </div>
    </div>
</body>
</html>
